# Production recipe: two nodes x four H100 80GB (eight GPUs total).
# Launch with scripts/run_h100_8gpu_opd.py through the matching sbatch script.
# Global batch = (2*4 / rollout TP 1) * 16 = 128. Actor micro_batch=1, KL chunk=64.
# Keep eager mode and the memory-fix hook from the completed four-GPU trial.
# TP=1 restores eight rollout replicas; max_num_seqs=128 is a per-engine cap.
# Full dataset / one epoch: currently 113 steps; 16,384-token thinking unchanged.
# Six evaluations: steps 20/40/60/80/100 and final; each ~16 minutes historically.
# 12h is a walltime allowance, not a measured completion estimate on this layout.
# Resume only checkpoints from the same eight-GPU layout.
# Scheduling limits below do not cap response length.
method: opd
model_path: Qwen/Qwen3-1.7B
auto_prepare_model: false
local_models_only: true
project_name: efficient-reasoning
experiment_name: qwen3_1_7b_thinking_opd_efficient_reasoning_full_vocab_h100_8gpu_train
output_dir: /scratch/l/luli/src/opd-baselines/outputs/h100-8gpu-opd
use_wandb: true
wandb_mode: offline
wandb_entity: null
n_gpus_per_node: 4
vllm_tensor_parallel_size: 1
per_device_batch_size: 16
group_size: 1
ppo_mini_batch_size: 128
actor_use_dynamic_bsz: false
ppo_micro_batch_size_per_gpu: 1
total_training_steps: null
num_epochs: 1
learning_rate: 1.0e-06
warmup_steps: 25
weight_decay: 0.01
max_grad_norm: 1.0
kl_loss_coef: 0.0
max_train_samples: 100000
max_prompt_length: 2048
max_completion_length: 16384
actor_max_token_len_per_gpu: 18432
temperature: 1.0
top_p: 1.0
top_k_sampling: -1
mode: thinking
vllm_gpu_memory_utilization: 0.4
teacher_max_prompt_length: 4096
teacher_enable_thinking: false
teacher_prompt: Solve the problem correctly and concisely. Keep the reasoning steps
  needed to justify the answer; omit repetition, restating the problem, and unnecessary
  elaboration. For difficult problems, retain enough detail to avoid mistakes. Follow
  the original question's final-answer format.
teacher_model_path: Qwen/Qwen3-4B-Instruct-2507
teacher_enable_resource_pool: false
teacher_n_gpus_per_node: 4
teacher_tp_size: 4
teacher_gpu_memory_utilization: 0.25
distillation_num_workers: 8
distillation_loss_mode: k1
distillation_topk: 64
distillation_use_policy_gradient: true
distillation_use_task_rewards: false
distillation_loss_coef: 1.0
distillation_loss_max_clamp: 10.0
distillation_log_prob_min_clamp: -10.0
opd_loss_token_mode: full_vocab
opd_token_top_k: 32
opd_enable_metrics: true
opd_distribution_chunk_size: 64
train_files: /scratch/l/luli/data/lightning_opd/train/dapo_math_17k_en.parquet
val_files:
- /scratch/l/luli/data/lightning_opd/eval/amc23.parquet
- /scratch/l/luli/data/lightning_opd/eval/aime25.parquet
- /scratch/l/luli/data/lightning_opd/eval/aime26.parquet
- /scratch/l/luli/data/lightning_opd/eval/hmmt26.parquet
- /scratch/l/luli/data/lightning_opd/eval/gpqa_diamond.parquet
val_before_train: false
eval_steps: 20
val_max_prompt_length: 4096
val_max_completion_length: 16384
val_do_sample: true
val_n: 4
val_temperature: 1.0
val_top_p: 1.0
val_top_k: -1
val_batch_size: 16
save_eval_generations: false
save_steps: 5
max_checkpoints_to_keep: 1
checkpoint_save_contents:
- model
- optimizer
- extra
- hf_model
h100_runtime:
  student:
    enforce_eager: true
    enable_chunked_prefill: true
    max_num_batched_tokens: 4096
    max_num_seqs: 128
  teacher:
    enforce_eager: true
    enable_chunked_prefill: true
    max_num_batched_tokens: 4096
    max_num_seqs: 128
h100_nnodes: 2
