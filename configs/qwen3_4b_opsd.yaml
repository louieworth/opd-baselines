method: opsd
model_path: Qwen/Qwen3-4B-Base
auto_prepare_model: true

project_name: opd
experiment_name: qwen3_4b_opsd
output_dir: ./outputs/qwen3_4b/opsd
use_wandb: true
# Set an account/team name, or leave null to use WANDB_ENTITY or the W&B default.
wandb_entity: null
wandb_api_key: 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

# 8 GPUs x 128 prompts x 1 sample = 1,024 rollouts per step.
n_gpus_per_node: 8
vllm_tensor_parallel_size: 1
per_device_batch_size: 128
group_size: 1
ppo_mini_batch_size: 1024
total_training_steps: 300
num_epochs: 30

learning_rate: 1.0e-6
warmup_steps: 25
weight_decay: 0.01
max_grad_norm: 1.0
kl_loss_coef: 0.0

max_train_samples: 100000
max_prompt_length: 2048
max_completion_length: 16384
actor_max_token_len_per_gpu: 18432

temperature: 1.0
top_p: 1.0
top_k_sampling: -1
mode: plaint  # thinking | non-thinking | plaint; shared by train and eval

vllm_gpu_memory_utilization: 0.45
# 0.45 student + 0.30 teacher leaves ~20 GB per 80 GB GPU for FSDP2
# params/grads/Adam/activations. Upstream's OOM fix lowered
# actor_max_token_len_per_gpu to 18432, which halves the activation spike,
# but at 0.6 the two vLLM engines still reserve ~71 GB and eopd/opsd OOMed
# in actor_rollout_update_actor (10 GiB alloc with <1 GiB free).

# External-teacher reverse KL with pointwise clipping on teacher top-k.
teacher_model_path: Qwen/Qwen3-30B-A3B-Instruct-2507
teacher_enable_resource_pool: false
teacher_n_gpus_per_node: 8
teacher_tp_size: 4
teacher_gpu_memory_utilization: 0.3
distillation_num_workers: 8
distillation_loss_mode: reverse_kl_topk
distillation_topk: 64
# Must stay a positive integer: distillation_loss_mode=reverse_kl_topk requires it,
# and src/opd.py rejects the recipe outright otherwise. The 'fix oom' commit set this
# to null (valid for trd, which uses loss_mode=k1), which made every opsd job die in
# load_config before training. The OOM fix that matters here is
# actor_max_token_len_per_gpu=18432, which is retained.
distillation_use_policy_gradient: false
distillation_use_task_rewards: false
distillation_loss_coef: 1.0
distillation_loss_max_clamp: null
distillation_log_prob_min_clamp: null

train_files: data/train/dapo_math_17k.parquet
val_files:
  - data/eval/aime25.parquet
  - data/eval/aime26.parquet
  - data/eval/amobench.parquet
  - data/eval/mbppplus.parquet
  - data/eval/gpqa_diamond.parquet
  - data/eval/hmmt26.parquet
val_before_train: true
eval_steps: 25
val_max_prompt_length: 4096
val_max_completion_length: 16384
val_do_sample: true
val_n: 8
val_temperature: 0.7
val_top_p: 0.8
val_top_k: 20
val_batch_size: 16

save_steps: 25

# Upper-clip each vocabulary contribution before summing teacher top-k.
# null disables pointwise clipping; retained probabilities are not renormalized.
distillation_pointwise_clip: 0.05
