method: trd
model_path: Qwen/Qwen3-4B-Base
auto_prepare_model: true

project_name: opd
experiment_name: qwen3_4b_trd
output_dir: ./outputs/qwen3_4b/trd
use_wandb: true
# Set an account/team name, or leave null to use WANDB_ENTITY or the W&B default.
wandb_entity: null
wandb_api_key: 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

# 4 GPUs x 256 prompts x 1 sample = 1,024 rollouts per step.
n_gpus_per_node: 8
vllm_tensor_parallel_size: 1
per_device_batch_size: 128
group_size: 1
ppo_mini_batch_size: 1024
total_training_steps: 300
num_epochs: 30

learning_rate: 1.0e-6
warmup_steps: 25
weight_decay: 0.01
max_grad_norm: 1.0
kl_loss_coef: 0.0

max_train_samples: 100000
max_prompt_length: 2048
max_completion_length: 8192
actor_max_token_len_per_gpu: 40960

temperature: 1.0
top_p: 1.0
top_k_sampling: -1
mode: thinking  # thinking | non-thinking | plaint; shared by train and eval
# thinking (not plaint) so the TRD rewrite prompt goes through the teacher's chat
# template. data/refine.py only calls apply_chat_template for thinking/non-thinking;
# under plaint the Instruct teacher got raw text, never emitted a reliable stop, and
# 41-46% of rewrites hit the 16384 max_tokens cap (mean 10031 vs student's 1250),
# which made each step take ~6h and fed truncated trajectories back as targets.

vllm_gpu_memory_utilization: 0.25
# Reallocated toward the teacher, which is the bottleneck: teacher decode is
# 92% of step time (4808s) while student rollout is 4% (195s). Student+teacher
# still sum to 0.75, so the FSDP2 training budget is unchanged (no new OOM risk).
# 0.45 student + 0.30 teacher leaves ~20 GB per 80 GB GPU for FSDP2
# params/grads/Adam/activations. Upstream's OOM fix lowered
# actor_max_token_len_per_gpu to 18432, which halves the activation spike,
# but at 0.6 the two vLLM engines still reserve ~71 GB and eopd/opsd OOMed
# in actor_rollout_update_actor (10 GiB alloc with <1 GiB free).

# Native verl external-teacher distillation.
teacher_model_path: Qwen/Qwen3-30B-A3B-Instruct-2507
teacher_enable_resource_pool: false
teacher_n_gpus_per_node: 8
teacher_tp_size: 4
teacher_gpu_memory_utilization: 0.5
# KV cache goes 7.2 -> 24.8 GB/GPU (0.5*80 - 61/tp4 - overhead), lifting teacher
# decode concurrency from ~24 to ~80. tp cannot help here: Qwen3-30B-A3B has only
# num_key_value_heads=4, so teacher_tp_size>4 would duplicate KV heads instead.
distillation_num_workers: 8
distillation_loss_mode: k1
# null: vanilla sampled k1; positive integer: conditional top-k reverse KL + PPO.
distillation_topk: null
distillation_use_policy_gradient: true
distillation_use_task_rewards: false
distillation_loss_coef: 1.0
distillation_loss_max_clamp: 10.0
distillation_log_prob_min_clamp: -10.0

train_files: data/train/dapo_math_17k.parquet
val_files:
  - data/eval/aime25.parquet
  - data/eval/aime26.parquet
  - data/eval/amobench.parquet
  - data/eval/mbppplus.parquet
  - data/eval/gpqa_diamond.parquet
  - data/eval/hmmt26.parquet
val_before_train: true
eval_steps: 25
val_max_prompt_length: 4096
# Omit val_max_completion_length so validation follows max_completion_length (8192).
val_do_sample: true
val_n: 8
val_temperature: 0.7
val_top_p: 0.8
val_top_k: 20
val_batch_size: 16

save_steps: 25

# Derive rewrite input from max_prompt_length + max_completion_length + reserve:
# 2048 + 8192 + 2048 = 12288. This is a budget, not a guaranteed tokenizer bound.
# Set refine_max_prompt_length explicitly only to override this calculation.
refine_prompt_token_reserve: 2048

# Omit refine_max_new_tokens so y_r follows max_completion_length (8192).
# Teacher context is max(12288 + 8192, 2048 + 8192 + 1) = 20480.
